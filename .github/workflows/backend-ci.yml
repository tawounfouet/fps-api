name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # upstream v10.3.3 pinned commit
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv python pin 3.13
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests scripts alembic
      - run: uv run mypy src tests scripts alembic
      - run: uv run pytest -m "not integration" --cov=fps_platform --cov-report=term-missing --cov-report=xml -q
      - run: uv run python scripts/check_secrets.py
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- openapi/openapi.json

  media:
    runs-on: ubuntu-latest
    env:
      MEDIA_STORAGE_MODE: fake
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # upstream v10.3.3 pinned commit
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv python pin 3.13
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests scripts alembic
      - run: uv run pytest -q -m "not integration"
      - run: uv run pytest -q tests/unit/media tests/contracts/media tests/security/media
      - run: uv run python scripts/check_secrets.py
      - run: |
          before=$(shasum -a 256 openapi/openapi.json | cut -d' ' -f1)
          uv run python scripts/export_openapi.py >/dev/null
          after=$(shasum -a 256 openapi/openapi.json | cut -d' ' -f1)
          test "$before" = "$after"
      - run: uv run python scripts/check_media_storage_mode.py
      - run: |
          if ENVIRONMENT=production DJANGO_ENV=production uv run python scripts/check_media_storage_mode.py; then
            echo "fake storage mode was accepted in production"
            exit 1
          fi

  integration-postgres:
    needs: [quality, media]
    runs-on: ubuntu-latest
    env:
      FPS_DATABASE_URL: postgresql+psycopg://fps@127.0.0.1:5432/fps
      FPS_TEST_DATABASE_URL: postgresql+psycopg://fps@127.0.0.1:5432/fps
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fps
          POSTGRES_DB: fps
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U fps -d fps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # upstream v10.3.3 pinned commit
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv python pin 3.13
      - run: uv sync --frozen --all-groups
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - run: uv run alembic check
      - run: uv run python scripts/db_diagnostics.py
      - run: uv run pytest -m integration -q
      - run: uv run alembic upgrade head
      - run: uv run python scripts/seed.py

  container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --pull -t fps-platform:ci .
      - run: |
          docker run --rm -d --name fps-ci -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e DOCS_ENABLED=true \
            -e ALLOWED_ORIGINS='["http://localhost:3000"]' \
            fps-platform:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/live
          curl -fsS http://127.0.0.1:8000/version
          docker stop fps-ci
