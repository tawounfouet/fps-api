[project]
name = "fps-m0-compatibility-probe"
version = "0.0.1"
description = "Isolated reproducible verification of M0 BE-000-03 candidate stack, not the FPS application"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.165,<0.166",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8,<10",
  "httpx>=0.28,<1",
  "packaging>=24,<27",
  "uvicorn>=0.30,<1",
]

[tool.uv]
package = false
