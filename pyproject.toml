[project]
name = "fps-platform"
version = "0.1.0"
description = "Backend FastAPI de la FPS Content Platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn>=0.35,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2.1,<2.2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "ruff>=0.13,<1",
    "mypy>=1.18,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fps_platform"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring PostgreSQL or Docker",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs/qualification/runtime-probe/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["pytest", "pydantic_settings"]
ignore_missing_imports = true
